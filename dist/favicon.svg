<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="card-orange" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fcd29b" />
            <stop offset="1" stop-color="#f8b670" />
        </linearGradient>
        <linearGradient id="card-blue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5f93bf" />
