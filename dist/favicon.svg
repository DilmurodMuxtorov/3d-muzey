    <rect x="40" y="8" width="48" height="48" rx="7" fill="url(#card-blue)" />
    <circle cx="56" cy="23" r="7" fill="#dce7f3" />
    <path d="M45 54 69 31l17 21v2z" fill="#b8cce4" />

